server.port=8080

# Spring Datasource (MySQL with environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql.railway.internal:3306/railway?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:jEohlLGlMsQuYbFDqxvQvXRKFfNuFhSg}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# App JWT Configuration
app.jwt.secret=${JWT_SECRET:NammaKartSecretKeyForJWTAuthTokenGeneration2026SecureKeyMustBeLongEnough}
app.jwt.expiration-milliseconds=86400000

# JSON Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
